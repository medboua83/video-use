name: Ubuntu video-use

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Ouvrir une session SSH Tailscale (necessite la configuration Tailscale)'
        type: boolean
        default: false
      minutes:
        description: 'Duree SSH en minutes (1 a 330)'
        default: '300'
        required: true
      desktop:
        description: 'Installer le bureau graphique XFCE (avec Tailscale)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: video-use-development
  cancel-in-progress: false

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Verifier la duree
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          if ! [[ "$MINUTES" =~ ^[0-9]{1,3}$ ]] || (( 10#$MINUTES < 1 || 10#$MINUTES > 330 )); then
            echo 'Choisir entre 1 et 330 minutes.'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Installer les outils video
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y ffmpeg fonts-liberation python3-venv
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
          npm install --global @openai/codex
          printf 'export PATH=%q:$PATH\n' "$(dirname "$(command -v node)")" >> "$HOME/.bashrc"
          mkdir -p "$HOME/.agents/skills" "$HOME/videos"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.agents/skills/video-use"
          echo "source '$GITHUB_WORKSPACE/.venv/bin/activate'" >> "$HOME/.bashrc"
      - name: Tester le depot et produire une video
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python helpers/timeline_view.py --help
          codex --version
          .venv/bin/python scripts/smoke_render.py
      - name: Telecharger le resultat du test
        uses: actions/upload-artifact@v4
        with:
          name: video-use-test-synthetique
          path: smoke-output/final.mp4
          retention-days: 1
      - name: Connexion privee Tailscale
        if: inputs.ssh
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:video-use
          hostname: video-use-${{ github.run_id }}
          tailscaled-args: --tun=tailscale0
          args: --ssh
      - name: Bureau graphique prive
        if: inputs.ssh && inputs.desktop
        run: bash scripts/start_desktop.sh
      - name: Informations de la session
        if: inputs.ssh
        run: |
          IP=$(tailscale ip -4)
          echo "Connexion : ssh runner@$IP"
          {
            echo '## Ubuntu video-use pret'
            echo '```sh'
            echo "ssh runner@$IP"
            echo "cd $GITHUB_WORKSPACE"
            echo 'source .venv/bin/activate'
            echo 'codex'
            echo '```'
            echo 'Connecte ton compte dans Codex. Pour transcrire, configure ELEVENLABS_API_KEY dans ta session SSH.'
            echo 'Les videos personnelles restent sur la machine : aucun envoi automatique en artefact.'
            echo 'Sauvegarde tes fichiers avant la fin et annule le workflow quand tu as termine.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Session SSH de test
        if: inputs.ssh
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          END=$((SECONDS + 10#$MINUTES * 60))
          while (( SECONDS < END )); do sleep 30; done
